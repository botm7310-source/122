<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جملة التساهيل — الفواتير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9f0ea;--g1:#6fd3bd;--g2:#9fb7ff;--g3:#ffd3a0;--card:rgba(255,255,255,.4);--pop:rgba(255,255,255,.94);--inp:rgba(255,255,255,.55);--edge:rgba(255,255,255,.75);--ink:#0f2e29;--mut:#3f5f58;--line:rgba(15,46,41,.18);--acc:#0b6b57;--on:#fff;--warn:#b3382c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06130f;--g1:#12806a;--g2:#2c47a8;--g3:#8a5a1e;--card:rgba(255,255,255,.08);--pop:rgba(16,36,31,.97);--inp:rgba(255,255,255,.08);--edge:rgba(255,255,255,.18);--ink:#e8f4f0;--mut:#9bb5ad;--line:rgba(255,255,255,.15);--acc:#4fd1b0;--on:#04201a;--warn:#ff9a8d}}
:root[data-theme="dark"]{--bg:#06130f;--g1:#12806a;--g2:#2c47a8;--g3:#8a5a1e;--card:rgba(255,255,255,.08);--pop:rgba(16,36,31,.97);--inp:rgba(255,255,255,.08);--edge:rgba(255,255,255,.18);--ink:#e8f4f0;--mut:#9bb5ad;--line:rgba(255,255,255,.15);--acc:#4fd1b0;--on:#04201a;--warn:#ff9a8d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.6 'IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif;background:radial-gradient(60% 45% at 12% 8%,var(--g1),transparent 70%),radial-gradient(55% 45% at 92% 28%,var(--g2),transparent 70%),radial-gradient(70% 50% at 35% 100%,var(--g3),transparent 70%),var(--bg);background-attachment:fixed;background-repeat:no-repeat}
.card,details,header,nav button{background:var(--card);border:1px solid var(--edge);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
header{padding:16px 16px 12px;text-align:center;border-width:0 0 1px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:1.8rem;font-weight:700}
#clk{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:.9rem;color:var(--mut)}
nav,main{max-width:720px;margin:0 auto;padding:12px}
nav{display:flex;gap:8px;padding-bottom:0}
nav button{flex:1;padding:10px 4px;border-radius:12px;color:var(--mut);font:inherit;font-size:.92rem;font-weight:600;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.card{border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;padding:11px 12px;border:1px solid var(--edge);border-radius:12px;background:var(--inp);color:var(--ink);font:inherit}
::placeholder{color:var(--mut);opacity:.75}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#hint{color:var(--acc);font-size:.85rem;margin-top:6px;min-height:1.3em}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.r>.p,.sg{grid-column:1/-1}
.sg{display:flex;flex-direction:column;gap:4px}
.sg:empty{display:none}
.sg button{display:flex;justify-content:space-between;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--pop);color:var(--ink);font:inherit;cursor:pointer}
.sg b{color:var(--acc);text-align:end;font-size:.85rem;line-height:1.4}
.f{margin:0;font-weight:400}
.f span{display:block;font-size:.75rem;color:var(--mut);margin:0 2px 2px}
.r .t{align-self:center;font-weight:600}
.r>button{justify-self:end;align-self:center}
.b{padding:12px 16px;border:0;border-radius:12px;background:var(--acc);color:var(--on);font:inherit;font-weight:700;cursor:pointer}
.b.o{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.b.w{color:var(--warn);border-color:var(--warn)}
.b.s{padding:6px 10px;font-size:.85rem}
.bar{display:flex;gap:8px}
.bar .b{flex:1}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:1.25rem;font-weight:700;padding-top:12px}
.pr{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;padding:10px;margin-bottom:8px}
.pr>.n{grid-column:1/-1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
details{border-radius:18px;margin-bottom:10px}
details details{background:none;border:0;border-top:1px dashed var(--line);border-radius:0;margin:0;-webkit-backdrop-filter:none;backdrop-filter:none}
summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
small{display:block;color:var(--mut);font-weight:400;font-size:.82rem}
.ls{padding:2px 14px 12px}
.ln{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
#q{margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.dev{text-align:center;color:var(--mut);font-size:.85rem;padding:12px 0 28px}
#toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;opacity:0;transition:opacity .2s}
#toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem}
#toast.on{opacity:1}
#sheet{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
:root{padding:0}
body{background:#fff}
#app{display:none!important}
#sheet{display:block;color:#000;background:#fff;font-size:14px;padding:8mm}
#sheet h1{text-align:center;margin:0 0 6px;font-size:26px}
#sheet .m{display:flex;justify-content:space-between;border-top:2px solid #000;border-bottom:2px solid #000;padding:6px 0;margin:8px 0}
#sheet table{width:100%;border-collapse:collapse;margin-top:8px}
#sheet th,#sheet td{border:1px solid #444;padding:6px 8px;text-align:right}
#sheet th{background:#eee}
#sheet .g{font-size:18px;font-weight:700;text-align:left;margin:10px 0}
#sheet footer{text-align:center;font-size:12px;border-top:1px dashed #666;padding-top:8px;margin-top:16px}
}
</style>
</head>
<body>
<div id="app">
<header><h1>جملة التساهيل</h1><div id="clk"></div></header>
<nav role="tablist"><button id="t1" aria-selected="true">فاتورة جديدة</button><button id="t2" aria-selected="false">المنتجات</button><button id="t3" aria-selected="false">الزبائن</button></nav>
<main>
<section id="v1">
<div class="card"><label for="cn">اسم الزبون</label><input id="cn" list="cl" placeholder="اكتب اسم الزبون" autocomplete="off"><datalist id="cl"></datalist><div id="hint"></div></div>
<div class="card"><div id="rows"></div><button class="b o" id="add" style="width:100%;margin-top:10px">+ إضافة منتج</button><div class="tot"><span>السعر النهائي</span><span id="gt">0 د.ع</span></div></div>
<div class="bar"><button class="b" id="sv">حفظ الفاتورة</button><button class="b o" id="pr">حفظ وطباعة</button></div>
</section>
<section id="v2" hidden>
<div class="card"><label for="pn">اسم المنتج</label><input id="pn" placeholder="مثال: شامبو 400 مل" autocomplete="off"><div class="two"><label class="f"><span>سعر الكارتون</span><input id="pc" type="number" inputmode="decimal" min="0" step="any"></label><label class="f"><span>سعر القطعة</span><input id="pp" type="number" inputmode="decimal" min="0" step="any"></label></div><button class="b" id="pa" style="width:100%;margin-top:12px">إضافة المنتج</button></div>
<div id="pl"></div>
</section>
<section id="v3" hidden><input id="q" placeholder="ابحث باسم الزبون"><div id="list"></div></section>
</main>
<div class="dev">المطور: أبو أسد</div>
<div id="toast" aria-live="polite"><span></span></div>
</div>
<div id="sheet"></div>
<script>
const $=s=>document.querySelector(s),K='tsh_data',D='tsh_draft',PK='tsh_prod',L='ar-IQ-u-ca-gregory-nu-latn',nt='type="number" inputmode="decimal" min="0" step="any"';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return 1}catch(e){return 0}};
const num=v=>parseFloat(v)||0,fm=n=>(Math.round(num(n)*100)/100).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const key=n=>n.trim().replace(/\s+/g,' ').toLowerCase();
const nk=n=>key(n).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const fd=(t,w)=>new Date(t).toLocaleDateString(L,{weekday:w,year:'numeric',month:'2-digit',day:'2-digit'});
const ft=t=>new Date(t).toLocaleTimeString(L,{hour:'2-digit',minute:'2-digit'});
let S=ld(K,{seq:0,c:{}}),P=ld(PK,[]),dr=ld(D,{}),items=dr.v==2&&dr.items&&dr.items.length?dr.items:[{}],tm;
if(S.v!=2){Object.values(S.c).forEach(c=>{c.inv.sort((a,b)=>a.t.localeCompare(b.t)).forEach((i,k)=>{i.n=k+1});c.cnt=c.inv.length});S.v=2;sv(K,S)}
const val=x=>num(x.c)>0||num(x.q)>0;
const lt=(x,v)=>v==2?num(x.c)*num(x.cr)+num(x.q)*num(x.r):val(x)?(num(x.c)||1)*(num(x.q)||1)*num(x.r):0;
const dl=(x,v)=>v==2?[x.c?fm(x.c)+' كارتون × '+fm(x.cr):'',x.q?fm(x.q)+' قطعة × '+fm(x.r):''].filter(Boolean).join('، '):[x.c?fm(x.c)+' كارتون':'',x.q?fm(x.q)+' قطعة':'','× '+fm(x.r)].filter(Boolean).join(' ');
const draft=()=>sv(D,{v:2,name:$('#cn').value,items});
const toast=m=>{const t=$('#toast');t.firstChild.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),2600)};
const tick=()=>{const n=new Date();$('#clk').innerHTML='<span>'+fd(n,'long')+'</span><span>الساعة '+ft(n)+'</span>'};
const sum=c=>c.inv.reduce((a,i)=>a+i.tot,0);
const arm=(b,f)=>{if(b.dataset.s)return f();const t=b.textContent;b.dataset.s='1';b.textContent='تأكيد الحذف';setTimeout(()=>{b.dataset.s='';b.textContent=t},3000)};
const clr=()=>document.querySelectorAll('.sg').forEach(s=>{s.innerHTML=''});
function rows(){$('#rows').innerHTML=items.map((x,i)=>`<div class="r" data-i="${i}"><input class="p" placeholder="اسم المنتج" autocomplete="off" value="${esc(x.p||'')}"><div class="sg"></div><label class="f"><span>كارتون</span><input class="c" ${nt} value="${esc(x.c||'')}"></label><label class="f"><span>سعر الكارتون</span><input class="k" ${nt} value="${esc(x.cr||'')}"></label><label class="f"><span>قطع</span><input class="q" ${nt} value="${esc(x.q||'')}"></label><label class="f"><span>سعر القطعة</span><input class="u" ${nt} value="${esc(x.r||'')}"></label><b class="t"></b><button class="b o s w" data-x="${i}" aria-label="حذف المنتج">✕</button></div>`).join('');calc()}
function calc(){let g=0;document.querySelectorAll('.r').forEach((r,i)=>{const t=lt(items[i],2);g+=t;r.querySelector('.t').textContent=t?'المجموع: '+fm(t):''});$('#gt').textContent=fm(g)+' د.ع'}
function sug(r,v){clr();const k=nk(v);if(!k)return;r.querySelector('.sg').innerHTML=P.map((x,i)=>[x,i]).filter(a=>nk(a[0].n).includes(k)).slice(0,6).map(([x,i])=>`<button data-s="${i}"><span>${esc(x.n)}</span><b>${[x.cr?'كارتون '+fm(x.cr):'',x.r?'قطعة '+fm(x.r):''].filter(Boolean).join('<br>')}</b></button>`).join('')}
function names(){$('#cl').innerHTML=Object.values(S.c).map(c=>`<option value="${esc(c.name)}">`).join('')}
function hint(){const v=$('#cn').value.trim(),c=S.c[key(v)];$('#hint').textContent=!v?'':c?`زبون مسجل: عدد فواتيره ${c.inv.length} بمجموع ${fm(sum(c))} د.ع، والفاتورة القادمة رقم ${c.cnt+1}`:'زبون جديد: فاتورته الأولى رقم 1'}
function save(){
const name=$('#cn').value.trim().replace(/\s+/g,' ')||'زبون نقدي',its=items.filter(x=>x.p&&x.p.trim()&&val(x)).map(x=>({p:x.p.trim(),c:num(x.c),cr:num(x.cr),q:num(x.q),r:num(x.r)}));
if(!its.length){toast('أضف منتجاً مع الكارتون أو القطع');return}
const k=key(name),c=S.c[k]||(S.c[k]={name,inv:[],cnt:0}),inv={n:++c.cnt,v:2,t:new Date().toISOString(),items:its,tot:its.reduce((a,x)=>a+lt(x,2),0)};
c.inv.push(inv);
toast(sv(K,S)?'تم حفظ الفاتورة باسم '+c.name:'تعذّر الحفظ على هذا المتصفح');
items=[{}];$('#cn').value='';rows();hint();names();draft();
return{inv,name:c.name}}
function printInv(inv,name){
$('#sheet').innerHTML=`<h1>جملة التساهيل</h1><div class="m"><span>فاتورة رقم: <b>${inv.n}</b></span><span>التاريخ: ${fd(inv.t)}</span><span>الساعة: ${ft(inv.t)}</span></div><p>اسم الزبون: <b>${esc(name)}</b></p><table><thead><tr><th>#</th><th>المنتج</th><th>كارتون</th><th>سعر الكارتون</th><th>قطع</th><th>سعر القطعة</th><th>المجموع</th></tr></thead><tbody>${inv.items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.p)}</td><td>${x.c?fm(x.c):''}</td><td>${x.cr?fm(x.cr):''}</td><td>${x.q?fm(x.q):''}</td><td>${x.r?fm(x.r):''}</td><td>${fm(lt(x,inv.v))}</td></tr>`).join('')}</tbody></table><div class="g">السعر النهائي: ${fm(inv.tot)} د.ع</div><footer>المطور: أبو أسد</footer>`;
try{window.print()}catch(e){}}
function plist(){$('#pl').innerHTML=P.length?P.map((x,i)=>`<div class="card pr" data-i="${i}"><input class="n" value="${esc(x.n)}" aria-label="اسم المنتج"><label class="f"><span>سعر الكارتون</span><input class="k" ${nt} value="${esc(x.cr||'')}"></label><label class="f"><span>سعر القطعة</span><input class="v" ${nt} value="${esc(x.r||'')}"></label><button class="b o s w" data-d="${i}">حذف</button></div>`).join(''):'<p class="empty">لا توجد منتجات بعد. أضف أول منتج من الأعلى.</p>'}
function list(){
const q=key($('#q').value),open=[...document.querySelectorAll('details[open]')].map(d=>d.dataset.k),last=c=>c.inv[c.inv.length-1].t;
const cs=Object.entries(S.c).filter(([k])=>k.includes(q)).sort((a,b)=>last(b[1]).localeCompare(last(a[1])));
const ia=(a,k,n,t)=>`<button class="b o s${a=='d'?' w':''}" data-a="${a}" data-k="${esc(k)}" data-n="${n}">${t}</button>`;
$('#list').innerHTML=cs.length?cs.map(([k,c])=>`<details data-k="${esc(k)}"${open.includes(k)?' open':''}><summary><span>${esc(c.name)}<small>عدد الفواتير: ${c.inv.length}</small></span><b>${fm(sum(c))} د.ع</b></summary>${c.inv.slice().reverse().map(i=>`<details data-k="${esc(k)}:${i.n}"${open.includes(k+':'+i.n)?' open':''}><summary><span>فاتورة رقم ${i.n}<small>${fd(i.t)} — ${ft(i.t)}</small></span><b>${fm(i.tot)} د.ع</b></summary><div class="ls">${i.items.map(x=>`<div class="ln"><span>${esc(x.p)}<small>${dl(x,i.v)}</small></span><b>${fm(lt(x,i.v))}</b></div>`).join('')}<div class="bar" style="margin-top:10px">${ia('p',k,i.n,'طباعة')}${ia('d',k,i.n,'حذف')}</div></div></details>`).join('')}</details>`).join(''):'<p class="empty">لا توجد فواتير محفوظة بعد.</p>'}
const tab=n=>{[1,2,3].forEach(i=>{$('#v'+i).hidden=i!=n;$('#t'+i).setAttribute('aria-selected',i==n)});clr();if(n==2)plist();if(n==3)list()};
$('#rows').addEventListener('input',e=>{const r=e.target.closest('.r'),f={p:'p',c:'c',k:'cr',q:'q',u:'r'}[e.target.className];if(!r||!f)return;items[+r.dataset.i][f]=e.target.value;calc();draft();if(f=='p')sug(r,e.target.value)});
$('#rows').addEventListener('focusin',e=>{if(!e.target.closest('.sg'))clr()});
$('#rows').addEventListener('click',e=>{
const s=e.target.closest('[data-s]');
if(s){const i=+s.closest('.r').dataset.i,x=P[+s.dataset.s];items[i].p=x.n;items[i].cr=x.cr||'';items[i].r=x.r||'';rows();draft();document.querySelectorAll('.r')[i].querySelector('.c').focus();return}
const b=e.target.closest('[data-x]');if(b){items.splice(+b.dataset.x,1);if(!items.length)items=[{}];rows();draft()}});
document.addEventListener('click',e=>{if(!e.target.closest('.sg,.p'))clr()});
$('#add').onclick=()=>{items.push({});rows();draft();const p=document.querySelectorAll('.r .p');p[p.length-1].focus()};
$('#cn').addEventListener('input',()=>{hint();draft()});
$('#sv').onclick=save;
$('#pr').onclick=()=>{const r=save();if(r)printInv(r.inv,r.name)};
$('#pa').onclick=()=>{
const n=$('#pn').value.trim().replace(/\s+/g,' '),r=num($('#pp').value),cr=num($('#pc').value);
if(!n){toast('اكتب اسم المنتج');return}
const o=P.find(x=>nk(x.n)==nk(n));
if(o){o.r=r;o.cr=cr;toast('تم تحديث أسعار المنتج')}else{P.push({n,r,cr});toast('تمت إضافة المنتج')}
P.sort((a,b)=>a.n.localeCompare(b.n,'ar'));sv(PK,P);$('#pn').value=$('#pp').value=$('#pc').value='';plist();$('#pn').focus()};
$('#pl').addEventListener('input',e=>{const r=e.target.closest('.pr'),f={n:'n',k:'cr',v:'r'}[e.target.className];if(!r||!f)return;P[+r.dataset.i][f]=f=='n'?e.target.value:num(e.target.value);sv(PK,P)});
$('#pl').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b)arm(b,()=>{P.splice(+b.dataset.d,1);sv(PK,P);plist()})});
$('#q').oninput=list;
$('#list').addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
const c=S.c[b.dataset.k];if(!c)return;
const inv=c.inv.find(i=>i.n==b.dataset.n);if(!inv)return;
if(b.dataset.a=='p')printInv(inv,c.name);
else arm(b,()=>{c.inv=c.inv.filter(i=>i!==inv);if(!c.inv.length)delete S.c[b.dataset.k];sv(K,S);names();list();toast('تم حذف الفاتورة')})});
[1,2,3].forEach(i=>{$('#t'+i).onclick=()=>tab(i)});
$('#cn').value=dr.name||'';rows();names();hint();tick();setInterval(tick,20000);
</script>
</body>
</html>
